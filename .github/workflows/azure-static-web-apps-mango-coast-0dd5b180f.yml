name: Azure Static Web Apps CI/CD

# Keep production deployments on main and previews on pull requests targeting main.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write # Allow the existing GitHub integration to comment on previews.
    steps:
      # Check out the event's code, preserving the existing submodule/LFS behavior.
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          lfs: false

      # Build with Node.js 24 and cache npm downloads, not node_modules.
      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Install the exact dependency versions recorded in the lockfile.
      - name: Install dependencies
        run: npm ci

      # Stop before building or deploying if Astro/TypeScript validation fails.
      - name: Check Astro and TypeScript
        run: npm run check

      # Generate the static production website in dist using the selected Node version.
      - name: Build production website
        run: npm run build

      # Validate generated links, assets, accessibility markup, and Azure 404 config.
      - name: Test generated output
        run: npm run test:static

      # Upload only after all preceding steps pass; Azure must not rebuild this output.
      # The same action preserves production deployment and PR preview integration.
      - name: Deploy validated website
        if: ${{ success() }}
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_COAST_0DD5B180F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "dist" # Upload the directory built and tested above.
          api_location: "" # This static portfolio has no Azure Functions API.
          output_location: "" # Must be empty when supplying prebuilt output.
          skip_app_build: true

  # Close the PR's preview even if its earlier build/checks failed; no build is needed.
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      # Keep the existing close action and deployment token reference unchanged.
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_COAST_0DD5B180F }}
          action: "close"
