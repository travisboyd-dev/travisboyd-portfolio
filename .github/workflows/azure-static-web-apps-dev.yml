# Names this workflow in GitHub's Actions dashboard.
name: Azure Static Web Apps - Development

# Defines which GitHub events start this workflow.
on:
  # Runs automatically when commits are pushed to develop.
  push:
    branches:
      - develop

  # Allows us to start the workflow manually from GitHub.
  workflow_dispatch:

# Defines the jobs that run in our development pipeline.
jobs:
  # Unique identifier for our build and deployment job.
  build_and_deploy_dev:
    # Uses a GitHub-hosted Ubuntu virtual machine.
    runs-on: ubuntu-latest

    # Grants the workflow read access to repository contents.
    permissions:
      contents: read

    # Defines the operations to execute in order.
    steps:
      # Downloads the repository code onto the GitHub runner.
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          lfs: false
      # Installs Node.js 24 on the GitHub Actions runner.
      # Enables npm caching to speed up subsequent workflow runs.
      - name: Set up Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # Installs the exact dependencies recorded in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Checks Astro components and TypeScript for errors.
      - name: Check Astro and TypeScript
        run: npm run check
      # Builds the Astro application into production-ready static files.
      - name: Build website
        run: npm run build

      # Tests the generated website before allowing deployment.
      - name: Test generated output
        run: npm run test:static
      # Deploys the tested Astro website to our development Static Web App.
      - name: Deploy to Azure Development
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Authenticates using the development token stored in GitHub Secrets.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}

          # Uploads website content rather than closing an environment.
          action: "upload"

          # Specifies the directory containing our prebuilt Astro website.
          app_location: "dist"

          # No separate Azure Functions API is included.
          api_location: ""

          # No additional build-output subdirectory is needed.
          output_location: ""

          # Uses our existing validated build instead of rebuilding it.
          skip_app_build: true

          # Treats develop as the primary branch for this Azure Static Web App.
          production_branch: "develop"

    # Prevents this job from deploying when run on branches other than develop.
    if: github.ref == 'refs/heads/develop'
